# Global data standardisation policy
# This file is referenced by all preprocessing stages
# and MUST remain immutable after experiments start

video:
  container: mp4
  codec: h264
  fps: 25
  max_duration_seconds: 10
  resize:
    enabled: false        # Resize later in dataloader
    target_size: [224, 224]
  frame_sampling_fps: 3   # Balanced efficiency vs information
  jpeg_quality: 90

audio:
  format: wav
  channels: 1
  sample_rate: 16000
  normalize: true

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  metadata: data/metadata
  reports: reports
