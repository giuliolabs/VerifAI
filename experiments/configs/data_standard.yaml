# Global data standardisation policy
# Author: Giulio Dajani
# Project: VerifAI

video:
  container: mp4
  codec: h264
  fps: 25
  max_duration_seconds: 10
  resize:
    enabled: false
    target_size: [224, 224]
  frame_sampling_fps: 3   # Balanced efficiency vs information
  jpeg_quality: 90

audio:
  format: wav
  channels: 1
  sample_rate: 16000
  normalize: true

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  metadata: data/metadata
  reports: docs/reports
