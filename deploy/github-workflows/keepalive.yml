# Free Hugging Face Spaces sleep after ~48 h without traffic.
# This pings the API twice a day so vrifai.com stays instant for visitors.
name: Keep API awake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping health endpoint
        run: |
          API=$(grep -oE 'https://[^"]+\.hf\.space' website/config.js 2>/dev/null || true)
          API=${API:-https://giuliolabs-verifai.hf.space}
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 30 "$API/api/health" && exit 0
            echo "Attempt $i failed, waiting…"; sleep 30
          done
          exit 1
        shell: bash
