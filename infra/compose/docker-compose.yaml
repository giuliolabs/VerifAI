version: "3.9"

services:
  backend:
    build:
      context: ../../backend
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    env_file:
      - ../../backend/.env
    restart: always

  frontend:
    build:
      context: ../../frontend
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app
    depends_on:
      - backend
    restart: always
